name: CPU checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tracecheck-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHECK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install minimal browser test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - name: Check exact feature head on CPU
        run: |
          test "$(git rev-parse HEAD)" = "$CHECK_HEAD"
          bash scripts/check.sh
